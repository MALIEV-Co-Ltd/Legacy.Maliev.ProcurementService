name: Build and test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      VSTestCollect: XPlat Code Coverage
      VSTestLogger: trx
      VSTestResultsDirectory: ${{ github.workspace }}/runner-results
    steps:
      - name: Check out ProcurementService
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: ecb05cbbd68717e415f69df2ac488c1d323b1da3
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Set up SDK for mandatory focused workflow checks
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Build before mandatory focused workflow checks
        timeout-minutes: 5
        run: |
          export GITHUB_ACTIONS=false
          dotnet restore Legacy.Maliev.ProcurementService.slnx -p:UseLocalMalievDependencies=true
          dotnet build Legacy.Maliev.ProcurementService.slnx --configuration Release --no-restore -warnaserror -p:UseLocalMalievDependencies=true
      - name: Execute mandatory focused workflow checks
        timeout-minutes: 2
        env:
          VSTestResultsDirectory: ${{ github.workspace }}/focused-workflow-results
        run: |
          export GITHUB_ACTIONS=false
          dotnet test Legacy.Maliev.ProcurementService.Tests/Legacy.Maliev.ProcurementService.Tests.csproj --configuration Release --no-build --no-restore -p:UseLocalMalievDependencies=true --filter "FullyQualifiedName~ActualAuthProgramJoin|FullyQualifiedName~ReviewedImagePreload|FullyQualifiedName=Legacy.Maliev.ProcurementService.Tests.Workflows.WorkflowContractTests.BuildAndTest_SatisfiesStructuralContract"
      - name: Require every focused workflow execution
        if: always()
        run: |
          python3 -B -m unittest discover -s scripts -p test_focused_workflow_results.py
          python3 -B scripts/verify-focused-workflow-results.py focused-workflow-results
      - name: Preserve focused workflow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: procurement-focused-workflow-${{ github.sha }}
          path: focused-workflow-results
          if-no-files-found: warn
          retention-days: 7
      - name: Verify PO header RED guard using synthetic TRX
        timeout-minutes: 1
        run: python3 -B -m unittest discover -s scripts -p test_po_header_hosted_red.py
      - name: Prove PO header baseline RED with exact nine-case joins
        timeout-minutes: 12
        run: python3 -B scripts/verify-po-header-hosted-red.py run
      - name: Restore reviewed candidate and require Release zero warnings and errors
        if: always()
        timeout-minutes: 6
        run: python3 -B scripts/verify-po-header-hosted-red.py rebuild
      - name: Preserve isolated PO header RED and restoration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: procurement-po-header-red-${{ github.sha }}
          path: po-header-red-control-results
          if-no-files-found: error
          retention-days: 7
      - name: Verify consumed purchase-order header binding through actual MVC
        timeout-minutes: 10
        env:
          VSTestResultsDirectory: ${{ github.workspace }}/purchase-order-header-results
        run: |
          export GITHUB_ACTIONS=false
          dotnet test Legacy.Maliev.ProcurementService.Tests/Legacy.Maliev.ProcurementService.Tests.csproj --configuration Release --no-build --no-restore -p:UseLocalMalievDependencies=true --filter "FullyQualifiedName~ProcurementPurchaseOrderHeaderBindingTests"
      - name: Require all 135 header binding executions
        if: always()
        run: |
          python3 -B scripts/verify-purchase-order-header-results.py --self-test
          python3 -B scripts/verify-purchase-order-header-results.py purchase-order-header-results
      - name: Preserve focused header binding evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: procurement-header-binding-${{ github.sha }}
          path: purchase-order-header-results
          if-no-files-found: error
          retention-days: 7
      - name: Check out exact tested PR61 scanner provenance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ProcurementService
          ref: 54ac1012748ba3ab0c68e51511eca081cbcf1e70
          path: .proc61-gitleaks-scan
          fetch-depth: 1
          persist-credentials: false
      - name: Temporarily diagnose PR61 gitleaks provenance privately
        shell: bash
        timeout-minutes: 6
        run: bash scripts/run_proc61_gitleaks_diagnostic.sh
      - name: Validate .NET solution
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/dotnet-validate@e3a6093324a24968876782153286f52db8b29fd8
        with:
          solution: Legacy.Maliev.ProcurementService.slnx
          use-local-maliev-dependencies: 'true'
      - name: Gate owned production coverage
        run: python3 scripts/verify-runner-coverage.py runner-results
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: procurement-validation-${{ github.sha }}
          path: runner-results
          if-no-files-found: warn
          retention-days: 7
