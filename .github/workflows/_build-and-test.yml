name: Build and test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      VSTestCollect: XPlat Code Coverage
      VSTestLogger: trx
      VSTestResultsDirectory: ${{ github.workspace }}/runner-results
    steps:
      - name: Check out ProcurementService
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: ecb05cbbd68717e415f69df2ac488c1d323b1da3
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Set up SDK for mandatory focused workflow checks
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Build before mandatory focused workflow checks
        timeout-minutes: 5
        env:
          GITHUB_ACTIONS: 'false'
        run: |
          dotnet restore Legacy.Maliev.ProcurementService.slnx
          dotnet build Legacy.Maliev.ProcurementService.slnx --configuration Release --no-restore -warnaserror
      - name: Execute mandatory focused workflow checks
        timeout-minutes: 2
        env:
          GITHUB_ACTIONS: 'false'
          VSTestResultsDirectory: ${{ github.workspace }}/focused-workflow-results
        run: dotnet test Legacy.Maliev.ProcurementService.Tests/Legacy.Maliev.ProcurementService.Tests.csproj --configuration Release --no-build --no-restore --filter "FullyQualifiedName~ActualAuthProgramJoin|FullyQualifiedName~ReviewedImagePreload"
      - name: Require every focused workflow execution
        if: always()
        run: |
          python3 -B -m unittest discover -s scripts -p test_focused_workflow_results.py
          python3 -B scripts/verify-focused-workflow-results.py focused-workflow-results
      - name: Preserve focused workflow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: procurement-focused-workflow-${{ github.sha }}
          path: focused-workflow-results
          if-no-files-found: warn
          retention-days: 7
      - name: Validate .NET solution
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/dotnet-validate@e3a6093324a24968876782153286f52db8b29fd8
        with:
          solution: Legacy.Maliev.ProcurementService.slnx
          use-local-maliev-dependencies: 'true'
      - name: Gate owned production coverage
        run: python3 scripts/verify-runner-coverage.py runner-results
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: procurement-validation-${{ github.sha }}
          path: runner-results
          if-no-files-found: warn
          retention-days: 7
