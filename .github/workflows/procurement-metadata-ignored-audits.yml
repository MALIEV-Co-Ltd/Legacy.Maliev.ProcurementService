name: Metadata ignored audit dates baseline and candidate332

on:
  pull_request:
    branches: [main, develop, staging]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: procurement-metadata-ignored-audits-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  metadata-ignored-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEGACY_DEPLOY_ENABLED: 'false'
      TreatWarningsAsErrors: 'true'
      BuildInParallel: 'false'
      DOTNET_PROCESSOR_COUNT: '1'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      MSBUILDDISABLENODEREUSE: '1'
      UseSharedCompilation: 'false'
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      VSTestCollect: XPlat Code Coverage
      VSTestLogger: trx
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require initial unchanged resource admission
        timeout-minutes: 1
        run: python3 -B scripts/require-metadata-identity-admission.py metadata-ignored-audits-results initial
      - name: Check out immutable pre-change baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ProcurementService
          ref: 665f796eab8a6eea37fd1189d3c0821fc1dc5fa9
          path: .metadata-ignored-audits-baseline
          persist-credentials: false
      - name: Check out accepted Defaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: ecb05cbbd68717e415f69df2ac488c1d323b1da3
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Set up accepted SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Bind identical332 harness and exact source inputs
        timeout-minutes: 2
        run: python3 -B scripts/prepare-metadata-ignored-audits-baseline.py .metadata-ignored-audits-baseline docs/procurement-metadata-ignored-audits-contract.json
      - name: Require source and evidence controls in normal and optimized Python
        timeout-minutes: 3
        run: |
          python3 -B -m unittest discover -s scripts -p test_metadata_ignored_audits_results.py
          python3 -O -B -m unittest discover -s scripts -p test_metadata_ignored_audits_results.py
      - name: Require baseline build resource admission
        timeout-minutes: 1
        run: python3 -B scripts/require-metadata-identity-admission.py metadata-ignored-audits-results baseline-build
      - name: Build immutable baseline before execution
        timeout-minutes: 5
        working-directory: .metadata-ignored-audits-baseline
        run: |
          export GITHUB_ACTIONS=false
          dotnet restore Legacy.Maliev.ProcurementService.slnx -p:UseLocalMalievDependencies=true
          dotnet build Legacy.Maliev.ProcurementService.slnx --configuration Release --no-restore --disable-build-servers -warnaserror -p:UseLocalMalievDependencies=true
      - name: Require baseline test resource admission
        timeout-minutes: 1
        run: python3 -B scripts/require-metadata-identity-admission.py metadata-ignored-audits-results baseline-test
      - name: Execute baseline332 with owned resource observation
        timeout-minutes: 6
        run: python3 -B scripts/observe-metadata-ignored-audits-providers.py .metadata-ignored-audits-baseline metadata-ignored-audits-results/baseline-audits baseline audits
      - name: Require exact source-forecast baseline identities and causal failures
        timeout-minutes: 2
        run: python3 -B scripts/verify-metadata-ignored-audits-results.py metadata-ignored-audits-results/baseline-audits baseline audits "$(cat metadata-ignored-audits-results/baseline-audits/test-exit-code.txt)"
      - name: Require candidate build resource admission
        timeout-minutes: 1
        run: python3 -B scripts/require-metadata-identity-admission.py metadata-ignored-audits-results candidate-build
      - name: Build reviewed candidate before execution
        timeout-minutes: 5
        run: |
          export GITHUB_ACTIONS=false
          dotnet restore Legacy.Maliev.ProcurementService.slnx -p:UseLocalMalievDependencies=true
          dotnet build Legacy.Maliev.ProcurementService.slnx --configuration Release --no-restore --disable-build-servers -warnaserror -p:UseLocalMalievDependencies=true
      - name: Require candidate test resource admission
        timeout-minutes: 1
        run: python3 -B scripts/require-metadata-identity-admission.py metadata-ignored-audits-results candidate-test
      - name: Execute candidate332 with owned resource observation
        timeout-minutes: 6
        run: python3 -B scripts/observe-metadata-ignored-audits-providers.py . metadata-ignored-audits-results/candidate-audits candidate audits
      - name: Require exact332 passes and shared actual baseline identities
        timeout-minutes: 2
        run: python3 -B scripts/verify-metadata-ignored-audits-results.py metadata-ignored-audits-results/candidate-audits candidate audits "$(cat metadata-ignored-audits-results/candidate-audits/test-exit-code.txt)" metadata-ignored-audits-results/baseline-audits
      - name: Require unchanged source admission and normal disposal proof
        if: always()
        timeout-minutes: 2
        run: python3 -B scripts/prepare-metadata-ignored-audits-baseline.py .metadata-ignored-audits-baseline docs/procurement-metadata-ignored-audits-contract.json --verify-only
      - name: Preserve isolated metadata audit baseline and candidate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: procurement-metadata-ignored-audits-${{ github.sha }}
          path: metadata-ignored-audits-results
          if-no-files-found: error
          retention-days: 7
